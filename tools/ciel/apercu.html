<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Aperçu du ciel FSky</title>
<style>
html,body{margin:0;background:#000}
canvas{display:block}
#cadre{position:relative}
.etiquette{position:absolute;padding:2px 6px;font:600 12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:#fff;background:rgba(0,0,0,.55);white-space:nowrap}
#resultat{margin:0;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#9ab;white-space:pre-wrap;word-break:break-all}
</style></head><body>
<!-- Aperçu autonome de FSky (src/skies.js), ouvert en file:// ; tout le travail est synchrone pendant le chargement.
 Fragment : #mode=vue|planche|verif|banc|sonde, puis monde=0 ou id=…, yaw, pitch et fov (degrés), t, w, h, couches=1111,
 tramage=1, vignette=0.76, masque=0, graine=0 ; banc : res=2560x1440, tours=40, passes=6, leviers=0.
 Le résultat JSON, entre marqueurs, va dans le pre ci-dessous, placé sous le canvas pour ne pas le couvrir. -->
<div id="cadre"><canvas id="ciel" width="16" height="16"></canvas></div>
<pre id="resultat"></pre>
<script src="../../src/skies.js"></script>
<script>
// Ancien ciel du moteur, pour le banc : copie à l'identique de src/renderer.js:445–492 (POST_VERT, SKY_FRAG).
const ANCIEN_VERT=`#version 300 es
  precision highp float;
  out vec2 vUV;
  void main(){
    vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
    vUV=p;gl_Position=vec4(p*2.-1.,0.,1.);
  }`;
const ANCIEN_FRAG=`#version 300 es
  precision highp float;
  in vec2 vUV;
  uniform vec3 uSkyRight;
  uniform vec3 uSkyUp;
  uniform vec3 uSkyForward;
  uniform vec3 uSkyTop;
  uniform vec3 uSkyBottom;
  uniform vec3 uSkyFog;
  uniform vec3 uSunDirection;
  uniform vec3 uSunColor;
  uniform vec2 uSkyFov;
  uniform vec2 uSkyMotion;
  out vec4 fragColor;
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float noise(vec2 p){
    vec2 a=floor(p),b=fract(p);b=b*b*(3.-2.*b);
    return mix(mix(hash(a),hash(a+vec2(1.,0.)),b.x),mix(hash(a+vec2(0.,1.)),hash(a+vec2(1.)),b.x),b.y);
  }
  float cloud(vec2 p){return noise(p)*.52+noise(p*2.03+11.)*.28+noise(p*4.17)*.14+noise(p*8.1)*.06;}
  void main(){
    vec2 uv=vUV*2.-1.;
    vec3 ray=normalize(uSkyForward+uSkyRight*uv.x*uSkyFov.x+uSkyUp*uv.y*uSkyFov.y);
    float elevation=clamp(ray.y,0.,1.);
    vec3 color=mix(uSkyBottom,uSkyTop,pow(elevation,.55));
    float sun=max(0.,dot(ray,uSunDirection));
    color+=uSunColor*(pow(sun,48.)*.20+pow(sun,650.)*.65+smoothstep(.99925,.99965,sun)*2.8);
    vec2 cloudUV=ray.xz/max(.13,ray.y+.18)*1.8+vec2(uSkyMotion.x*.006*uSkyMotion.y,0.);
    float clouds=smoothstep(.49,.73,cloud(cloudUV))*smoothstep(-.01,.24,ray.y);
    vec3 cloudColor=mix(uSkyBottom,vec3(1.12,1.10,1.01),.62)+uSunColor*pow(sun,6.)*.12;
    color=mix(color,cloudColor,clouds*.66);
    // Two distant ridgelines close the horizon without a flat, fog-coloured void.
    float angle=atan(ray.z,ray.x);
    float ridge=.018+noise(vec2(angle*5.,1.7))*.075+noise(vec2(angle*13.,4.))*.025;
    color=mix(color,mix(uSkyFog,uSkyBottom,.43),1.-smoothstep(ridge-.003,ridge+.003,ray.y));
    float nearRidge=-.025+noise(vec2(angle*7.+25.,2.8))*.065;
    color=mix(color,uSkyFog*.80,1.-smoothstep(nearRidge-.002,nearRidge+.002,ray.y));
    color=color/(color+vec3(.76));color=pow(max(color,vec3(0.)),vec3(.4545));
    float vignette=pow(max(0.,16.*vUV.x*vUV.y*(1.-vUV.x)*(1.-vUV.y)),.13);
    fragColor=vec4(color*mix(.76,1.,vignette),1.);
  }`;
(function(){
'use strict';

 // Texte d'erreur sans le chemin absolu du clone : les piles citent tools/… et src/…

try{
 const P=new URLSearchParams(location.hash.slice(1)),mode=r.mode=P.get('mode')||'vue';
 if(!['vue','planche','verif','banc','sonde'].includes(mode))throw new Error('mode inconnu : '+mode);
 if(typeof FSky!=='object'||!FSky)throw new Error('FSky absent : ../../src/skies.js non chargé');

   if(s.trim()===''||!ok(n))throw new Error('paramètre '+k+' : '+quoi+' attendu ('+s+')');return n;},

   const c=P.has('couches')?P.get('couches'):'1111';
   if(!/^[01]{4}$/.test(c))throw new Error('paramètre couches : 4 chiffres 0 ou 1 attendus ('+c+')');
   const o={t:nombre('t',0),vignette:nombre('vignette',.76),tramage:bit('tramage',1),masque:bit('masque',0),couches:[...c].map(Number)},
    fov=lire('fov',75,n=>n>0&&n<180,'angle entre 0 et 180 exclus'),
    yawP=P.has('yaw')?rad(nombre('yaw',0)):null,pitchP=P.has('pitch')?rad(lire('pitch',0,n=>n>=-90&&n<=90,'angle de -90 à 90')):null,
    cam=st=>{const d=defaut(st);return[yawP===null?d[0]:yawP,pitchP===null?d[1]:pitchP];},
    reglages={fov,t:o.t,couches:c,tramage:o.tramage,vignette:o.vignette,masque:o.masque,graine};
   if(mode==='vue'){
    let i;
    if(P.has('id')){const id=P.get('id');i=FSky.presets.findIndex(p=>p.id===id);if(i<0)throw new Error('paramètre id : préréglage inconnu ('+id+')');}
    else i=entier('monde',0,0,N-1);
    const st=etat(i),[yaw,pitch]=cam(st),W=cv.width,H=cv.height;
    gl.viewport(0,0,W,H);poser(prog,cache,st,FSky.view(yaw,pitch,rad(fov),W/H),H,o);tracer();
    Object.assign(r,{monde:i,id:st.id,principal:st.principal,w:W,h:H,yaw:arr(deg(yaw)),pitch:arr(deg(pitch))},reglages);
   }else{
    // Vignettes 320×180 : colonne = chapitre floor(i/3), ligne = biome i%3 ; gl.viewport compte y depuis le bas.
    const cadre=document.getElementById('cadre'),vignettes=[];

     gl.viewport(x,360-y,320,180);poser(prog,cache,st,FSky.view(yaw,pitch,rad(fov),320/180),180,o);tracer();
     const e=document.createElement('div');e.className='etiquette';e.style.left=x+'px';e.style.top=y+'px';
     e.textContent=String(i).padStart(2,'0')+' '+st.id;cadre.appendChild(e);

   }

   // Contrôle miroir : pixels GPU (couches 0000, sans tramage, vignette 1) contre encode(radianceAt) tous les 16 pixels.
   const W=320,H=180,px=new Uint8Array(W*H*4),pt=new Uint8Array(W*H*4),fovR=rad(75),etats=[],mondes=[],

     for(let y=0;y<H;y+=16)for(let x=0;x<W;x+=16){const u=(x+.5)/W*2-1,w=(y+.5)/H*2-1,
      d=[0,1,2].map(k=>v.forward[k]+v.right[k]*u*v.fov[0]+v.up[k]*w*v.fov[1]),e=FSky.encode(FSky.radianceAt(st,d)),j=(y*W+x)*4;

     // Tramage (CIEL-05), caméra par défaut : chaque niveau bouge d'au plus 1, et environ un tiers bougent.
     if(v===cams[0]){poser(prog,cache,st,v,H,{...o,tramage:1});tracer();gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,pt);
      for(let j=0;j<px.length;j++)if((j&3)!==3){const a=Math.abs(px[j]-pt[j]);if(a>tMax)tMax=a;if(a)tBouge++;tNb++;}}}

    mondes.push({monde:i,id:st.id,maxDiff:mm,moyenne:arr(s/n,4),cameras:parCam});}
   Object.assign(r,{maxDiff:mx,moyenne:arr(somme/nb,4),points:nb/3,mondes});
   if(mx>2)r.erreurs.push('contrôle miroir : maxDiff '+mx+' > 2');
   r.tramage={maxEcart:tMax,part:arr(tBouge/tNb,4)};
   if(tMax>1||tBouge/tNb<.05)r.erreurs.push('tramage : écart '+tMax+', part '+r.tramage.part+' (attendu ≤ 1 et ≥ 0,05)');
   // Shader de contrôle : FOG_GLSL inclus seul dans un autre programme (brouillard par direction, CIEL-07).
   const pC=lier(FSky.VERT,'#version 300 es\nprecision highp float;\n'+FSky.FOG_GLSL+'out vec4 o;\nvoid main(){o=vec4(fskyFog(vec3(1.,0.,0.)),1.);}','contrôle FOG_GLSL'),

   if(im<0)r.erreurs.push('masque : aucun préréglage de jour');
   else{const st=etats[im],[yaw,p0]=defaut(st),v=FSky.view(yaw,p0,fovR,W/H),sv=st.sun,dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],fz=dot(sv,v.forward),
     sx=(dot(sv,v.right)/fz/v.fov[0]+1)/2*W-.5,sy=(dot(sv,v.up)/fz/v.fov[1]+1)/2*H-.5,om={...o,couches:[0,0,1,0],masque:1};

    for(let k=0;k<nv;k++){const x=V[(k+d)%nv];ligne[x[0]]=mesure(x[1]);}
    if(t>=0)for(const k in ligne)S[k].push(ligne[k]-ligne.uni);}
   const q=(a,f)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor((s.length-1)*f+.5))];},
    b={res:W+'x'+H,tours,passes,leviers,representatif:!/SwiftShader|llvmpipe|softpipe|Software/i.test(r.renderer)};
   for(const k in S)if(k!=='uni')b[k]={mediane:arr(q(S[k],.5)),p10:arr(q(S[k],.1)),p90:arr(q(S[k],.9))};
   for(const k in S)if(k!=='uni'&&k!=='ancien')b[k].rapport=arr(b[k].mediane/b.ancien.mediane);
   gl.bindFramebuffer(gl.FRAMEBUFFER,null);r.banc=b;
  }
 }
 const e=gl.getError();r.glError=e;if(e)r.erreurs.push('gl.getError() vaut '+e);
}catch(e){r.erreurs.push(texte(e));}
ecrire();
})();
