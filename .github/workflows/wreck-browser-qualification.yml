name: METAL combat browser qualification
on:
  push:
    branches: [codex/wrecks-combat-demos-20261117]
    paths: ['.github/workflows/wreck-browser-qualification.yml']
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore exact source patch and authenticated full-suite evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/metal-evidence/previous
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/M4D135/METAL/actions/artifacts/14311723115/zip' -o /tmp/prior.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,base64,lzma,subprocess
          assert hashlib.sha256(Path('/tmp/prior.zip').read_bytes()).hexdigest()=='2e3262b03e4b20be22caae91630d885be5b99c5ae8e1226fd8e521c209da6b79'
          with zipfile.ZipFile('/tmp/prior.zip') as z:
              for name in ['tests.txt','combat-soak.json','source.patch','SIZE.json','browser/report.json','browser.txt','node.txt']:
                  p=Path('/tmp/metal-evidence/previous')/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
          encoded=''.join(Path(f'tools/mission-20261117/wreck-combat.patch.{i}.b64').read_text().strip() for i in range(1,4))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='e571734be30747c5d0cf5b2ca27a158aec5d93ef1ff44763fa00de288f075b7f'
          assert patch==Path('/tmp/metal-evidence/previous/source.patch').read_bytes()
          Path('/tmp/metal-evidence/source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/metal-evidence/source.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/metal-evidence/source.patch'],check=True)
          p=Path('tools/mission-20261117/browser-combat-smoke.mjs');s=p.read_text()
          replacements=[('Real headless Chrome; offline current standalone, software WebGL2. No hardware FPS claim.','Real headless Chrome; offline standalone, software WebGL2 at 480x320 with 960x640 captures. No hardware FPS claim.'),('timeoutMs:180000,launchTimeoutMs:20000,window:[960,640]','timeoutMs:360000,launchTimeoutMs:20000,window:[480,320]'),('label,ms=140000','label,ms=220000')]
          for a,b in replacements:
              assert s.count(a)==1;s=s.replace(a,b)
          a=" const check=(name,pass)=>{assert(pass,name);report.checks.push(name);};"
          b=a+"\n // Resize only the software-GPU test viewport. Never change simulation time or player state.\n const capture=async(name)=>{await page.send('Emulation.setDeviceMetricsOverride',{width:960,height:640,deviceScaleFactor:1,mobile:false});await page.evaluate('new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))');const shot=await page.send('Page.captureScreenshot',{format:'png'});writeFileSync(join(output,name),Buffer.from(shot.data,'base64'));await page.send('Emulation.setDeviceMetricsOverride',{width:480,height:320,deviceScaleFactor:1,mobile:false});};"
          assert s.count(a)==1;s=s.replace(a,b)
          for variable,name in [('shot','combat-first-person.png'),('chase','combat-follow-camera.png')]:
              a=" const "+variable+"=await page.send('Page.captureScreenshot',{format:'png'});writeFileSync(join(output,'"+name+"'),Buffer.from("+variable+".data,'base64'));"
              assert s.count(a)==1;s=s.replace(a," await capture('"+name+"');")
          p.write_text(s)
          PY
          git diff --check
      - name: Rebuild and prove game bytes identical to full qualification
        run: |
          set -euo pipefail
          python3 tools/build.py | tee /tmp/metal-evidence/build.txt
          cp SIZE.json /tmp/metal-evidence/SIZE.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          assert Path('SIZE.json').read_bytes()==Path('/tmp/metal-evidence/previous/SIZE.json').read_bytes()
          assert hashlib.sha256(Path('dist/index.html').read_bytes()).hexdigest()=='0a08aabba483e79d1717d67c45084e984af68ae3e3997d0cdede8e2be967c8ca'
          text=Path('/tmp/metal-evidence/previous/tests.txt').read_text()
          counts={k:int(re.findall(r'^# '+k+r' (\d+)$',text,re.M)[-1]) for k in ['tests','pass','fail','todo']}
          assert counts=={'tests':1351,'pass':1350,'fail':0,'todo':1}
          assert json.loads(Path('/tmp/metal-evidence/previous/combat-soak.json').read_text())['ok']
          print('Identical game bytes; complete suite evidence:',counts)
          PY
          node --check tools/mission-20261117/browser-combat-smoke.mjs
          node checks/build.test.mjs | tee /tmp/metal-evidence/distribution.txt
      - name: Complete real Chrome combat and geometry checks
        run: |
          set -o pipefail
          node tools/mission-20261117/browser-combat-smoke.mjs /tmp/metal-evidence/browser 2>&1 | tee /tmp/metal-evidence/browser.txt
      - name: Real Chrome keyboard regression checks
        run: |
          set -o pipefail
          node tools/mission-20261117/browser-bindings-smoke.mjs /tmp/metal-evidence/bindings 2>&1 | tee /tmp/metal-evidence/bindings.txt
      - name: Commit exact qualified source and standalone
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORK_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$WORK_BRANCH" = 'codex/wrecks-combat-demos-20261117'
          git fetch origin "$WORK_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('/tmp/metal-evidence');b=json.loads((root/'browser/report.json').read_text());k=json.loads((root/'bindings/report.json').read_text());assert b['ok'] and k['ok']
          soak=json.loads((root/'previous/combat-soak.json').read_text());assert soak['ok']
          size=json.loads(pathlib.Path('SIZE.json').read_text())
          report='# METAL 0.12.8 : composants originaux et démos de combat\n\nBase : `ba2784517b99b092c404df38a8408f2733cc2221`.\n\n'
          report+='## Livré\n\nLes ennemis morts se séparent en groupes de composants du modèle original : formes, dimensions, couleurs et matériaux conservés. Les boîtes de collision restent invisibles. Suppression de la pluie de cubes à la mort et des cubes d’impact, remplacés pour les impacts par de fines traînées lumineuses. Les pièces chutent séparément et leurs sauvegardes sont validées. Budget physique borné.\n\n'
          report+='Six démos de vrais combats utilisant le jeu actuel, profils lourd et drone, sans scènes de présentation des boss. Caméra de jeu puis caméra suiveuse avec collisions. Passage à la scène suivante après le combat, sans téléportation, guérison ou restauration forcée du personnage.\n\n'
          report+='Pilote : cheminement borné, prise en compte du gabarit, des obstacles physiques, des pièges et des bords ; anticipation, freinage, contournement et replanification. Suppression des coups et dashs de déblocage. Correction du repère de mouvement quand la visée tourne avant le déplacement.\n\n'
          report+='## Preuves exécutées\n\nSuite complète : **1 350 réussites, zéro échec, un TODO historique, 1 351 tests comptés**. Exécution 44045094131. Les attentes historiques de ragdoll lié et de déblocage par coups ont été remplacées par les comportements demandés, sans suppression des contrôles de collisions ou sauvegardes. Verrou FERRO : 34 modules exacts.\n\n'
          report+='Le premier contrôle Chrome validait déjà les tirs, les morts et 49 composants originaux sur six corps physiques, mais expirait avant la vue suiveuse : 6,87 secondes simulées atteintes sur GPU logiciel. Seul le banc navigateur est adapté à 480×320, avec captures 960×640 et délai élargi. Aucune horloge, position ou vie du jeu modifiée. Le HTML et SIZE.json sont strictement identiques à la qualification complète, et les preuves précédentes sont téléchargées et vérifiées par SHA-256.\n\n'
          report+='Nouvelle exécution Chrome : **'+str(len(b['checks']))+' contrôles de combat et '+str(len(k['checks']))+' contrôles clavier réussis**, rendu '+str(b.get('renderer'))+'.\n\n'
          report+='| Monde | Profil | Secondes testées | Tirs | Tués | Pénétrations | Blocage consécutif max. | Boss visibles | Coups sur obstacles |\n|---|---|---:|---:|---:|---:|---:|---:|---:|\n'
          for r in soak['rows']:
              report+='| '+str(r['world'])+' | '+r['profile']+' | '+str(round(r['seconds'],2))+' | '+str(r['shots'])+' | '+str(r['kills'])+' | '+str(r['collisionFrames'])+' | '+str(r['blockedRunMax'])+' | '+str(r['bossVisibleFrames'])+' | '+str(r['forcedObstacleAttacks'])+' |\n'
          report+='\nContrôles Chrome :\n'+''.join('- '+c+'\n' for c in b['checks'])
          report+='\nHTML : '+str(size['html_bytes'])+' octets ; gzip '+str(size['gzip_bytes'])+' ; SHA-256 `'+size['sha256']+'`.\n\n'
          report+='Exécution complète : https://github.com/M4D135/METAL/actions/runs/44045094131\n\nValidation navigateur : https://github.com/M4D135/METAL/actions/runs/'+os.environ['RUN_ID']+'\n\n'
          report+='## Limites\n\nTests sur les six scènes fixes et cas de régression, pas garantie universelle d’absence de bug. GPU logiciel : aucun gain FPS matériel revendiqué. Pas de test téléphone ou manette physique. Le budget des épaves reste borné. Aucun hébergement externe modifié.\n'
          pathlib.Path('docs/audits/wrecks-combat-demos-20261117.md').write_text(report)
          PY
          git add -- src/metal-physics.js src/simulation.js src/game.js src/pilot.js src/demo-metal.js checks/wreck-geometry.test.mjs checks/demo-combat.test.mjs checks/ragdoll.test.mjs checks/pilot.test.mjs package.json tools/simulation-modules.json tools/mission-20261117/combat-demo-soak.mjs tools/mission-20261117/browser-combat-smoke.mjs dist/index.html SIZE.json docs/audits/wrecks-combat-demos-20261117.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: native enemy fragments and current combat title demos (0.12.8)'
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          git rev-parse HEAD > /tmp/metal-evidence/qualified-commit.txt
      - name: Preserve exact evidence
        if: always()
        run: |
          mkdir -p /tmp/metal-evidence
          cp dist/index.html /tmp/metal-evidence/METAL-0.12.8.html
          git diff > /tmp/metal-evidence/uncommitted.patch
          git archive --format=tar.gz HEAD > /tmp/metal-evidence/source.tar.gz
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-combat-browser-${{ github.run_id }}
          path: /tmp/metal-evidence
          retention-days: 7
