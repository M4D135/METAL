name: METAL public retry qualification
on:
  push:
    branches: [codex/flight-fixes-20261117]
    paths: ['.github/workflows/public-retry-once.yml']
permissions:
  contents: write
concurrency:
  group: metal-public-retry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact locally checked historical test corrections
        run: |
          mkdir -p /tmp/metal-evidence
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          expected={'checks/checkpoint.test.mjs':('c395021ec4475475be756f3149bc2c67ab1743c4','8cc362145c9f6b3a2703879c5b610b0472900a23'),'checks/controls.test.mjs':('09d3745954075872b9633d8c803b27fe0f7ad1d0','11815569d809378aca4dd2c2214a782dca05f917'),'checks/finput.test.mjs':('fc4b7a6fc039fd04f6235c6d03e39301bc3f094b','9e93e4e889f88df3be2c050d025384cf7cea53da')}
          for path,(before,after) in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==before,path
          p=Path('checks/checkpoint.test.mjs');s=p.read_text()
          s=s.replace('paired weapon and R always dashes','paired weapon and C always dashes')
          s=s.replace("app.key('KeyR');app.frame(100);app.key('KeyR',false);assert(sim.state.player.dash>0,'R always dashes, whatever the left hand holds');", "app.key('KeyC');app.frame(100);app.key('KeyC',false);assert(sim.state.player.dash>0,'C always dashes, whatever the left hand holds');")
          s=s.replace("app.key('KeyR');app.frame(100);app.key('KeyR',false);assert(sim.state.player.dash>0);", "app.key('KeyC');app.frame(100);app.key('KeyC',false);assert(sim.state.player.dash>0);")
          s=s.replace('default view; C or the 1P/3P','default view; R or the 1P/3P')
          s=s.replace("app.key('KeyC');app.key('KeyC',false);for(let i=0;i<20;i++)app.frame(1000/60);frame=app.frames.at(-1);", "app.key('KeyR');app.key('KeyR',false);for(let i=0;i<20;i++)app.frame(1000/60);frame=app.frames.at(-1);")
          s=s.replace('<kbd>Espace · R</kbd>','<kbd>Espace · C</kbd>').replace('<kbd>C</kbd><span>vue','<kbd>R</kbd><span>vue');p.write_text(s)
          p=Path('checks/controls.test.mjs');s=p.read_text().replace('Space/R and A/Cross','Space/C and A/Cross').replace('dodge; C switches the view','dodge; R switches the view')
          s=s.replace("new Set(['KeyR']),'dash'", "new Set(['KeyC']),'dash'").replace("new Set(['KeyC']),'view'", "new Set(['KeyR']),'view'")
          s=s.replace("const r=rig(),old=plain(r.prefs);delete old.bindings.view;old.bindings.fireLeft=['KeyC'];", "const r=rig(),old=plain(r.prefs);old.bindingsVersion=2;delete old.bindings.view;old.bindings.dash=['KeyR'];old.bindings.fireLeft=['KeyC'];")
          s=s.replace("plain(migrated.bindings.view),['KeyC']", "plain(migrated.bindings.view),['KeyR']")
          s=s.replace("delete old.bindingsVersion;delete old.bindings.jump;", "delete old.bindingsVersion;delete old.bindings.view;delete old.bindings.jump;");p.write_text(s)
          p=Path('checks/finput.test.mjs');s=p.read_text()
          s=s.replace("for (const id of Object.keys(o)) if (id !== 'dash') assert.equal(json(n[id]), json(o[id]), why + ' : ' + id);\n    assert.equal(json(n.dash), json(['KeyR']), why);", "for (const id of Object.keys(o)) assert.equal(json(n[id]), json(o[id]), why + ' : ' + id);\n    assert.equal(json(n.dash), json(o.dash), why);")
          s=s.replace("const edit = change => { const old = plain(O.defaults()); change(old.bindings); return old; };", "// Build genuine historical tables, not v3 tables with intentional duplicate R/C keys.\n  const edit = change => { const old = plain(O.defaults()); old.bindingsVersion=2; old.bindings.view=['KeyC']; old.bindings.dash=['KeyR']; change(old.bindings); return old; };")
          s=s.replace("// Planned difference (FEEL-01, FEEL-09): R is the dodge in v2; options.test.mjs:18 puts interact on R, so it takes another free key at the hookup.\n  assert.equal(F.assign(current, v1, 'keyboard', 'interact', 'KeyR').conflict, 'dash');", "// Current host defaults: R belongs to view, C to dodge. The engine-only v2\n  // fixture in E22 intentionally keeps its separate historical R-dodge contract.\n  assert.equal(F.assign(current, v1, 'keyboard', 'interact', 'KeyC').conflict, 'dash');\n  assert.equal(F.assign(current, v1, 'keyboard', 'interact', 'KeyR').conflict, 'view');");p.write_text(s)
          for path,(before,after) in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==after,path
          p=Path('package.json');package=json.loads(p.read_text());assert package['version']=='0.12.6';package['version']='0.12.7';p.write_text(json.dumps(package,indent=2)+'\n')
          PY
      - name: Prepare reproducible browser smoke test
        run: |
          cat > tools/mission-20261117/browser-bindings-smoke.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync,mkdirSync} from 'node:fs';
          import {resolve,join} from 'node:path';
          import {withChrome} from '../render/chrome.mjs';
          const output=resolve(process.argv[2]||'/tmp/metal-browser');mkdirSync(output,{recursive:true});
          const report={kind:'Real headless Chrome, offline standalone game; no hardware FPS claim',checks:[]};
          try {
            await withChrome({timeoutMs:120000,launchTimeoutMs:20000,window:[1280,800],angle:'swiftshader',extraArgs:['--no-sandbox']},async browser=>{
              report.browser=browser.version;
              const page=await browser.openPage(resolve('tools/render/pages/probe.html'));
              await page.send('Page.addScriptToEvaluateOnNewDocument',{source:`
                localStorage.setItem('ferro-settings',JSON.stringify({demo:false,muted:true,quality:'low',shadows:false,bloom:false,reflections:'off',autoTune:false}));
                let api;
                Object.defineProperty(window,'FSimulation',{configurable:true,get(){return api;},set(value){
                  api=value;const create=value.create;
                  value.create=function(...args){const sim=create.apply(this,args),step=sim.step;
                    sim.step=function(dt,input){window.__smokeInput={...input};return step.call(this,dt,input);};
                    window.__smokeSim=sim;return sim;};
                }});
              `});
              await page.send('Page.navigate',{url:new URL('file://'+resolve('dist/index.html')+'?jobs=main').href});
              const wait=async(expression,label,ms=90000)=>{
                const end=Date.now()+ms;
                while(Date.now()<end){if(await page.evaluate(expression))return;await new Promise(r=>setTimeout(r,100));}
                throw Error('Timed out: '+label+'; state='+await page.evaluate('document.body?.dataset.state'));
              };
              const check=(name,condition)=>{assert(condition,name);report.checks.push(name);};
              const key=async(code,type='keyDown',repeat=false)=>{
                const name=code==='Escape'?'Escape':code.replace('Key','');
                await page.send('Input.dispatchKeyEvent',{type,code,key:name,windowsVirtualKeyCode:code==='Escape'?27:name.charCodeAt(0),autoRepeat:repeat});
              };
              const tap=async code=>{await key(code);await key(code,'keyUp');};
              const saved=()=>page.evaluate("JSON.parse(localStorage.getItem('ferro-settings'))");
              await wait("document.body?.dataset.state==='menu' && !!window.__smokeSim",'menu initialized');
              let settings=await saved();check('R view / C dodge defaults',settings.bindings.view[0]==='KeyR'&&settings.bindings.dash[0]==='KeyC');
              check('versioned preferences',settings.bindingsVersion===3);
              await page.evaluate("document.getElementById('start').click()");
              await wait("document.body.dataset.state==='playing'",'new expedition');
              check('heavy starts active',await page.evaluate("__smokeSim.state.activeProfile==='heavy'"));
              await key('KeyR');await key('KeyR','keyDown',true);await key('KeyR','keyUp');
              check('R switches view once despite repeat',(await saved()).view==='third');
              await key('KeyC');await wait('__smokeSim.state.player.dash>0','C heavy dodge',10000);await key('KeyC','keyUp');
              check('C dodge does not switch view',(await saved()).view==='third');
              await tap('KeyT');await wait("__smokeSim.state.activeProfile==='light'",'drone selection',10000);
              await key('KeyC');await wait('!!window.__smokeInput?.descendHeld','C held drone descent',10000);
              check('drone descent is held',await page.evaluate('__smokeInput.descendHeld===true'));
              await key('KeyC','keyUp');await wait('window.__smokeInput?.descendHeld===false','descent released',10000);
              check('release clears drone descent',true);
              await page.evaluate("document.getElementById('intro-options').click();document.getElementById('tab-controls').click();document.getElementById('bind-view').click()");
              await tap('KeyH');settings=await saved();check('view rebind persists',settings.bindings.view[0]==='KeyH');
              check('rebind leaves dodge unchanged',settings.bindings.dash[0]==='KeyC');
              await page.evaluate("document.getElementById('bind-view').click()");await tap('KeyE');
              check('conflict is reported',await page.evaluate("document.getElementById('binding-status').textContent.includes('Déjà utilisée')"));
              check('conflict preserves prior key',(await saved()).bindings.view[0]==='KeyH');await tap('Escape');
              await page.evaluate("document.getElementById('reset-keys').click()");settings=await saved();
              check('keyboard reset restores R/C',settings.bindings.view[0]==='KeyR'&&settings.bindings.dash[0]==='KeyC');
              check('HUD key labels follow reset',await page.evaluate("document.getElementById('bind-view').textContent==='R' && document.getElementById('bind-dash').textContent==='C'"));
              report.renderer=await page.evaluate('document.body.dataset.renderer');
              report.pageErrors=page.errors;check('no uncaught page exception',page.errors.length===0);
              const shot=await page.send('Page.captureScreenshot',{format:'png'});writeFileSync(join(output,'bindings.png'),Buffer.from(shot.data,'base64'));
              report.ok=true;
            });
          }catch(error){report.ok=false;report.error=error.stack;process.exitCode=1;}
          writeFileSync(join(output,'report.json'),JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));
          JS
          node --check tools/mission-20261117/browser-bindings-smoke.mjs
      - name: Verify locked engine and rebuild
        run: |
          set -o pipefail
          python3 tools/build.py | tee /tmp/metal-evidence/build.txt
          cp SIZE.json /tmp/metal-evidence/SIZE.json
      - name: Complete qualification
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/metal-evidence/tests.txt
      - name: Offline Chrome with real DOM and keyboard dispatch
        run: |
          set -o pipefail
          node tools/mission-20261117/browser-bindings-smoke.mjs /tmp/metal-evidence/browser 2>&1 | tee /tmp/metal-evidence/browser.txt
      - name: Commit exact qualified files without overwriting another contribution
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORK_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$WORK_BRANCH" = 'codex/flight-fixes-20261117'
          git fetch origin "$WORK_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json,os,pathlib,re
          text=pathlib.Path('/tmp/metal-evidence/tests.txt').read_text()
          counts={key:int(re.findall(r'^# '+key+r' (\d+)$',text,re.M)[-1]) for key in ('tests','pass','fail','todo')}
          assert counts['fail']==0
          browser=json.loads(pathlib.Path('/tmp/metal-evidence/browser/report.json').read_text());assert browser['ok']
          size=json.loads(pathlib.Path('SIZE.json').read_text())
          report='# METAL 0.12.7 : qualification du dépôt public\n\n'
          report+='Sources de départ : b1dfdea97f21432141130842558b278081a9dd91.\n\n'
          report+='Huit échecs hérités portaient sur les anciennes touches R/C et des tables de test historiques construites avec les défauts modernes. Les attentes sont corrigées, sans suppression de test. Les tests génériques FERRO v2 conservent leur ancien contrat indépendant.\n\n'
          report+='Suite complète npm test : '+json.dumps(counts)+' ; construction autonome et tests de distribution réussis. Verrou FERRO : 34 modules exacts.\n\n'
          report+='Chrome headless : '+str(len(browser['checks']))+' vérifications réussies ; moteur de rendu '+str(browser.get('renderer'))+'. '+browser['kind']+'.\n\n'
          report+='Contrôles navigateur :\n'+''.join('- '+c+'\n' for c in browser['checks'])
          report+='\nHTML : '+str(size['html_bytes'])+' octets bruts ; gzip : '+str(size['gzip_bytes'])+' ; SHA-256 : `'+size['sha256']+'`.\n\n'
          report+='Exécution : https://github.com/M4D135/METAL/actions/runs/'+os.environ['RUN_ID']+'\n\n'
          report+='Ce lot livre les corrections caméra et clavier, pas le strafe-jump Quake III ni le vol quaternion 6DOF. Aucun gain FPS global, aucune validation manette physique ou téléphone réel revendiqués. Aucun hébergement externe n’est modifié.\n'
          pathlib.Path('docs/audits/public-retry-20261117.md').write_text(report)
          PY
          git add -- checks/checkpoint.test.mjs checks/controls.test.mjs checks/finput.test.mjs package.json dist/index.html SIZE.json tools/mission-20261117/browser-bindings-smoke.mjs docs/audits/public-retry-20261117.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: qualify R/C integration and publish rebuilt METAL 0.12.7'
          git push origin "HEAD:refs/heads/$WORK_BRANCH"
          git rev-parse HEAD > /tmp/metal-evidence/qualified-commit.txt
      - name: Preserve exact evidence and playable standalone
        if: always()
        run: |
          mkdir -p /tmp/metal-evidence
          cp dist/index.html /tmp/metal-evidence/METAL-0.12.7.html
          git diff > /tmp/metal-evidence/uncommitted.patch
          git archive --format=tar.gz HEAD > /tmp/metal-evidence/source.tar.gz
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-public-retry-${{ github.run_id }}
          path: /tmp/metal-evidence
          retention-days: 7
