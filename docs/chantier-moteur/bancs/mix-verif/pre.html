<!doctype html><meta charset="utf-8">
<script src="src.js"></script><script src="scenes.js"></script><script src="mix.js"></script>
<script>
(async () => { const M = window.MIX, out = {errors: []};
  try { (0, eval)(SRC.music); const sc = M.isoScene();
    for (const music of [0, .45]) { const R = await M.render(sc, {}, {music}), sr = M.SR, b = R.buffer, rows = [];
      for (let k = 0; k < 130; k += 5) { const a = Math.round(k / 60 * sr), z = Math.round((k + 5) / 60 * sr); rows.push([k, M.r2(R.red[k] || 0), M.r3(M.peakRange(b.getChannelData(0), a, z)), M.r3(M.peakRange(b.getChannelData(4), a, z)), M.r3(M.peakRange(b.getChannelData(8), a, z)), M.r3(M.peakRange(b.getChannelData(6), a, z))]); }
      out['music' + music] = rows; }
  } catch (e) { out.errors.push(String(e && e.stack || e)); }
  M.emit(out); })();
</script>
