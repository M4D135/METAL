<!doctype html><html><head><meta charset="utf-8"><title>glcost</title></head><body>
<canvas id="c" width="64" height="64"></canvas>
<pre id="out"></pre>
<script>
// Cout CPU reel (Chrome/ANGLE) des appels WebGL2 utilises par renderer.js, par appel, synchrones.
(function(){
const out={};
try{
const gl=document.getElementById('c').getContext('webgl2');
const dbg=gl.getExtension('WEBGL_debug_renderer_info');out.renderer=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
const vs=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vs,'#version 300 es\nlayout(location=0) in vec3 p;layout(location=2) in vec4 a;layout(location=3) in vec4 b;layout(location=4) in vec4 c;layout(location=5) in vec4 d;void main(){gl_Position=vec4(p*0.0001+a.xyz*0.0+b.xyz*0.0+c.xyz*0.0+d.xyz*0.0,1.0);}');gl.compileShader(vs);
const fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(fs,'#version 300 es\nprecision mediump float;out vec4 o;void main(){o=vec4(1);}');gl.compileShader(fs);
const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);gl.useProgram(pr);
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,0,1,0,0,0,1,0]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,12,0);
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2]),gl.STATIC_DRAW);
const inst=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,inst);const rows=new Float32Array(4000*16);gl.bufferData(gl.ARRAY_BUFFER,rows,gl.DYNAMIC_DRAW);
for(let i=2;i<6;i++){gl.enableVertexAttribArray(i);gl.vertexAttribDivisor(i,1);gl.vertexAttribPointer(i,4,gl.FLOAT,false,64,(i-2)*16);}
const px=new Uint8Array(4);const sync=()=>gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
const med=a=>a.slice().sort((x,y)=>x-y)[a.length>>1];
function bench(name,n,fn,reps=9){const t=[];for(let r=0;r<reps;r++){sync();const t0=performance.now();for(let i=0;i<n;i++)fn(i);t.push((performance.now()-t0)/n*1000);}out[name+' (us/call)']=+med(t).toFixed(3);}
bench('vertexAttribPointer',20000,i=>gl.vertexAttribPointer(2+(i&3),4,gl.FLOAT,false,64,((i>>2)%500)*64+(i&3)*16));
bench('drawElementsInstanced(3 idx, 40 inst)',4000,i=>gl.drawElementsInstanced(gl.TRIANGLES,3,gl.UNSIGNED_SHORT,0,40));
bench('uniform3fv',20000,()=>{});
const u=gl.getUniformLocation(pr,'x');
bench('bindBuffer',20000,i=>gl.bindBuffer(gl.ARRAY_BUFFER,(i&1)?inst:vb));
gl.bindBuffer(gl.ARRAY_BUFFER,inst);
// Upload of ~250 KB of instance rows: bufferData (re-specify, varying size) vs bufferSubData into capacity storage
const big=new Float32Array(250*1024/4);
const sizes=[0.9,1,0.95,1.05,0.97].map(f=>Math.floor(big.length*f/16)*16);
const cap=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,cap);gl.bufferData(gl.ARRAY_BUFFER,big.byteLength*2,gl.DYNAMIC_DRAW);
bench('bufferData 225-262 KB varying size',300,i=>{gl.bufferData(gl.ARRAY_BUFFER,big.subarray(0,sizes[i%5]),gl.DYNAMIC_DRAW);});
bench('bufferSubData 225-262 KB into capacity',300,i=>{gl.bufferSubData(gl.ARRAY_BUFFER,0,big,0,sizes[i%5]);});
bench('bufferData 16 KB varying size',2000,i=>{gl.bufferData(gl.ARRAY_BUFFER,big.subarray(0,4096-(i%5)*16),gl.DYNAMIC_DRAW);});
bench('bufferSubData 16 KB',2000,i=>{gl.bufferSubData(gl.ARRAY_BUFFER,0,big,0,4096-(i%5)*16);});
// Per-frame pattern of renderer.js: 4 vertexAttribPointer + 1 drawElementsInstanced per group, 55 groups/frame
gl.bindBuffer(gl.ARRAY_BUFFER,inst);
bench('frame pattern: 55 x (4 vAP + draw) (us/frame)',200,()=>{for(let g=0;g<55;g++){for(let i=2;i<6;i++)gl.vertexAttribPointer(i,4,gl.FLOAT,false,64,g*640+(i-2)*16);gl.drawElementsInstanced(gl.TRIANGLES,3,gl.UNSIGNED_SHORT,0,10);}},7);
// VAO alternative: one bindVertexArray per group (VAOs prebuilt with fixed offsets)
const vaos=[];for(let g=0;g<55;g++){const v=gl.createVertexArray();gl.bindVertexArray(v);gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,12,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bindBuffer(gl.ARRAY_BUFFER,inst);for(let i=2;i<6;i++){gl.enableVertexAttribArray(i);gl.vertexAttribDivisor(i,1);gl.vertexAttribPointer(i,4,gl.FLOAT,false,64,g*640+(i-2)*16);}vaos.push(v);}
bench('frame pattern VAO: 55 x (bindVertexArray + draw) (us/frame)',200,()=>{for(let g=0;g<55;g++){gl.bindVertexArray(vaos[g]);gl.drawElementsInstanced(gl.TRIANGLES,3,gl.UNSIGNED_SHORT,0,10);}},7);
out.error=gl.getError();
}catch(e){out.exception=String(e&&e.stack||e);}
document.getElementById('out').textContent=JSON.stringify(out);
})();
</script></body></html>
